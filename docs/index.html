<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ink &amp; Malice</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@700;800&family=Alegreya+Sans:wght@400;500;700;800&family=IM+Fell+English+SC&display=swap">
<style>
:root {
  /* Layout: a card table seen from above. Rivals across the top, the duel in the middle, your hand at the bottom, the chronicle at the side. */
  --felt: #15211d;
  --felt-2: #1c2c26;
  --felt-3: #263d34;
  --line: #3a5247;
  --text: #ece4d1;
  --muted: #a3ae9f;
  --parch: #f3e9d2;
  --parch-2: #dfcda5;
  --parch-edge: #b49b6c;
  --ink: #221c17;
  --brass: #c9a55c;
  --brass-hi: #ead293;
  --wax: #9d2633;
  --wax-hi: #d0525e;
  --good: #8cc79a;
  --f-display: "IM Fell English SC", "Iowan Old Style", Georgia, serif;
  --f-glyph: "Alegreya SC", Georgia, "Times New Roman", serif;
  --f-body: "Alegreya Sans", "Gill Sans", "Segoe UI", system-ui, sans-serif;
  --g: 54px;
  color-scheme: dark;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; background: radial-gradient(120% 80% at 50% 0%, var(--felt-3) 0%, var(--felt) 62%) fixed, var(--felt); color: var(--text); font: 16px/1.45 var(--f-body); -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1220px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 48px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; text-wrap: balance; margin: 0; }
p { margin: 0; }
button { font: inherit; color: inherit; }
.eyebrow { display: block; font: 700 11px/1.2 var(--f-body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-bottom: 12px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
.brand { font: 28px/1 var(--f-display); color: var(--brass-hi); letter-spacing: .02em; }
.brand span { color: var(--wax-hi); }
.top-right { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.chip { font: 700 12px/1 var(--f-body); letter-spacing: .1em; text-transform: uppercase; padding: 7px 11px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); }
.chip.warn { color: var(--wax-hi); border-color: var(--wax); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; font: 800 15px/1.1 var(--f-body); letter-spacing: .02em; padding: 11px 16px; border-radius: 9px; border: 1px solid #8f7135; background: linear-gradient(180deg, #dcbc72, #b48d42); color: #1b150d; cursor: pointer; box-shadow: 0 2px 0 #6f5525; transition: transform .1s ease, filter .1s ease; }
.btn:hover { filter: brightness(1.06); }
.btn:active { transform: translateY(1px); box-shadow: none; }
.btn.ghost { background: transparent; color: var(--text); border-color: var(--line); box-shadow: none; }
.btn.ghost:hover { border-color: var(--brass); }
.btn.danger { background: linear-gradient(180deg, var(--wax-hi), var(--wax)); color: #fff2f2; border-color: #6d1520; box-shadow: 0 2px 0 #4f0f17; }
.btn.small { padding: 7px 11px; font-size: 14px; }
.btn:disabled { opacity: .4; cursor: not-allowed; filter: none; }
.btn:focus-visible, button.glyph:focus-visible, .picker button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--brass-hi); outline-offset: 2px; }

label, .label { font: 700 12px/1.2 var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
select, input[type=text] { font: 16px var(--f-body); color: var(--text); background: var(--felt); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; width: 100%; min-width: 0; }
.field { display: grid; gap: 5px; }
.check { display: flex; gap: 9px; align-items: center; text-transform: none; letter-spacing: 0; font: 500 15px var(--f-body); color: var(--text); cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--brass); }
.row { display: flex; gap: 8px; align-items: end; flex-wrap: wrap; }
.row > .field { flex: 1 1 120px; }

.glyph { position: relative; display: inline-grid; place-items: center; width: var(--g); height: calc(var(--g) * 1.32); flex: none; padding: 0; border-radius: 8px; border: 1px solid var(--parch-edge); background: linear-gradient(165deg, var(--parch) 0%, var(--parch-2) 100%); color: var(--ink); box-shadow: 0 2px 0 #8f7650, 0 8px 16px rgba(0,0,0,.32); font-family: var(--f-glyph); user-select: none; -webkit-user-select: none; }
.glyph::before { content: ""; position: absolute; inset: 3px; border: 1px solid rgba(110,86,50,.28); border-radius: 6px; pointer-events: none; }
button.glyph { cursor: pointer; transition: transform .12s ease, opacity .12s ease; }
button.glyph:hover { transform: translateY(-3px); }
.glyph .l { font-size: calc(var(--g) * .56); font-weight: 800; line-height: 1; margin-top: -3px; }
.glyph .v { position: absolute; right: 6px; bottom: 4px; font: 800 calc(var(--g) * .22)/1 var(--f-body); color: #6b5534; }
.glyph.used { opacity: .22; transform: scale(.94); box-shadow: none; }
.glyph.disc { opacity: .5; transform: rotate(-5deg) translateY(4px); outline: 2px dashed var(--wax-hi); outline-offset: 2px; }
.glyph.gilt { background: linear-gradient(150deg, #fbeaa9 0%, #dcb553 55%, #f5df90 100%); border-color: #9a7520; }
.glyph.gilt .v { color: #5d4512; }
.glyph.blot { background: radial-gradient(circle at 47% 44%, #141a1f 0 33%, transparent 34%), radial-gradient(circle at 70% 66%, #141a1f 0 14%, transparent 15%), radial-gradient(circle at 26% 70%, #141a1f 0 9%, transparent 10%), radial-gradient(circle at 72% 24%, #141a1f 0 7%, transparent 8%), linear-gradient(165deg, var(--parch), var(--parch-2)); }
.glyph.blot .l { color: var(--parch); position: relative; z-index: 1; font-size: calc(var(--g) * .4); }
.glyph.mini { --g: 30px; box-shadow: 0 1px 0 #8f7650; }
.glyph.mini .v { right: 3px; bottom: 2px; }
.glyph.spent { opacity: .55; }
.glyph.enter { animation: drop .42s cubic-bezier(.2,.8,.3,1.2) both; }
@keyframes drop { from { transform: translateY(-22px) rotate(-7deg); opacity: 0; } to { transform: none; opacity: 1; } }

.seals { display: inline-flex; gap: 6px; }
.seal { position: relative; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font: 12px/1 var(--f-display); color: #f8d9d9; background: radial-gradient(circle at 34% 30%, var(--wax-hi), var(--wax) 55%, #5c1019 100%); box-shadow: inset 0 0 0 3px rgba(0,0,0,.2), 0 2px 3px rgba(0,0,0,.45); }
.seal.broken { color: #8c7f78; background: radial-gradient(circle at 34% 30%, #6b605b, #463d39 60%, #2e2826); }
.seal.broken::after { content: ""; position: absolute; top: -2px; bottom: -2px; left: 45%; width: 3px; background: var(--felt-2); transform: rotate(17deg); }
.back { width: 14px; height: 19px; border-radius: 3px; background: repeating-linear-gradient(45deg, #5d1b24 0 3px, #77232e 3px 6px); border: 1px solid rgba(201,165,92,.45); }

/* Home */
.hero { display: grid; grid-template-columns: minmax(0,1.1fr) minmax(0,1fr); gap: 32px; align-items: center; padding-block: 10px 30px; }
.hero h1 { font-size: clamp(46px, 7.4vw, 92px); line-height: .92; color: var(--brass-hi); }
.hero h1 span { color: var(--wax-hi); }
.lede { font-size: 19px; max-width: 32em; margin-top: 16px; }
.lede + .lede { font-size: 16px; color: var(--muted); margin-top: 10px; }
.demo { padding: 18px; border-radius: 16px; background: radial-gradient(130% 120% at 50% 0%, #2b443a, #1d2f28 70%); border: 1px solid var(--line); box-shadow: inset 0 0 50px rgba(0,0,0,.35); display: grid; gap: 10px; --g: 44px; }
.demo-row { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
.demo-cap { font-size: 14px; color: var(--muted); }
.demo-cap b { color: var(--brass-hi); }
.demo .vs { font: 20px var(--f-display); color: var(--wax-hi); padding-inline: 4px; }
.namebar { display: flex; gap: 12px; align-items: end; flex-wrap: wrap; margin-bottom: 14px; }
.namebar .field { width: min(320px, 100%); }
.modes { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; }
.mode { display: grid; gap: 12px; align-content: start; padding: 18px; border-radius: 16px; border: 1px solid var(--line); background: rgba(0,0,0,.18); min-width: 0; }
.mode h2 { font-size: 27px; color: var(--brass-hi); }
.mode > p { color: var(--muted); }
.mode .btn { justify-self: start; }
.hs-list { display: grid; gap: 6px; }
.hs-item { display: flex; gap: 6px; }
.resume { display: flex; gap: 6px; flex-wrap: wrap; }
.note { font-size: 14px; color: var(--muted); }
.primer { margin-top: 30px; display: grid; grid-template-columns: minmax(0,1.25fr) minmax(0,1fr); gap: 28px; }
.primer h2 { font-size: 30px; color: var(--brass-hi); }
.steps { list-style: none; counter-reset: s; padding: 0; margin: 14px 0 0; display: grid; gap: 12px; max-width: 62ch; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 34px minmax(0,1fr); gap: 10px; }
.steps li::before { content: counter(s); width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font: 14px/1 var(--f-display); color: #f8d9d9; background: radial-gradient(circle at 34% 30%, var(--wax-hi), var(--wax) 55%, #5c1019 100%); }
.values { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 10px 6px; margin-top: 14px; --g: 36px; }
.vcell { display: grid; justify-items: center; gap: 3px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* Lobby */
.lobby { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1.4fr); gap: 16px; }
.panel { padding: 20px; border-radius: 16px; border: 1px solid var(--line); background: rgba(0,0,0,.18); display: grid; gap: 12px; align-content: start; min-width: 0; }
.panel.gold { border-color: var(--brass); background: rgba(201,165,92,.07); }
.panel h2 { font-size: 26px; color: var(--brass-hi); }
.code { font: 54px/1 var(--f-glyph); letter-spacing: .14em; color: var(--brass-hi); overflow-wrap: anywhere; }
.seats { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.seats li { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; }
.seats .r-name { min-width: 0; overflow-wrap: anywhere; }

/* Game */
.game { display: grid; grid-template-columns: minmax(0,1fr) 290px; gap: 16px; align-items: start; }
.board { min-width: 0; display: grid; gap: 14px; }
.rivals { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.rival { display: grid; gap: 8px; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: rgba(0,0,0,.18); min-width: 0; transition: border-color .2s, background .2s; }
.rival header { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 8px; align-items: baseline; }
.r-name { font: 20px/1.1 var(--f-display); overflow-wrap: break-word; min-width: 0; }
.tag { font: 700 11px var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.r-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.backs { display: flex; gap: 3px; flex-wrap: wrap; }
.r-status { font-size: 14px; color: var(--muted); }
.rival.active { border-color: var(--brass); background: rgba(201,165,92,.09); }
.rival.active .r-status { color: var(--brass-hi); }
.rival.out { opacity: .42; }
.rival.hit { animation: hit .6s ease; }
@keyframes hit { 0%, 100% { background: rgba(0,0,0,.18); } 30% { background: rgba(157,38,51,.45); } }
.charm-chip { font: 700 12px var(--f-body); padding: 3px 8px; border-radius: 99px; border: 1px solid var(--brass); color: var(--brass-hi); }
.charm-chip.spent { opacity: .5; text-decoration: line-through; }

.table { position: relative; display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 20px; align-items: center; padding: 20px; border-radius: 18px; background: radial-gradient(130% 120% at 50% 0%, #2c463b, #1c2e27 72%); border: 1px solid var(--line); box-shadow: inset 0 0 0 6px rgba(0,0,0,.12), inset 0 0 70px rgba(0,0,0,.38); }
.table.shake { animation: shake .45s; }
@keyframes shake { 0%, 100% { transform: none; } 20% { transform: translateX(-7px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
.dial { --p: 0; width: 118px; aspect-ratio: 1; border-radius: 50%; background: conic-gradient(var(--brass) calc(var(--p) * 1%), #2c4339 0); display: grid; place-items: center; box-shadow: 0 0 0 1px var(--line), 0 10px 24px rgba(0,0,0,.35); }
.dial-in { width: 84%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 50% 35%, var(--felt-3), var(--felt)); display: grid; place-content: center; text-align: center; gap: 2px; }
.dial-in strong { font: 800 44px/1 var(--f-glyph); color: var(--brass-hi); font-variant-numeric: tabular-nums; }
.center { min-width: 0; display: grid; gap: 12px; }
.banner { font-size: 17px; min-height: 2.9em; }
.banner b { color: var(--brass-hi); font-weight: 700; }
.w { font-family: var(--f-glyph); font-weight: 800; letter-spacing: .06em; color: var(--parch) !important; }
.pool { display: flex; flex-wrap: wrap; gap: 6px; min-height: calc(var(--g) * 1.32); }
.pool.empty { align-items: center; justify-content: center; border: 1px dashed var(--line); border-radius: 10px; color: var(--muted); font-style: italic; }
.pool-cap { font-size: 13px; color: var(--muted); }
.sand-row { display: flex; align-items: center; gap: 10px; }
.sand { flex: 1; height: 8px; border-radius: 99px; background: #13201b; overflow: hidden; box-shadow: inset 0 1px 2px rgba(0,0,0,.6); }
.sand i { display: block; height: 100%; width: var(--pct, 100%); background: linear-gradient(90deg, #a8843f, var(--brass-hi)); transition: width .2s linear; }
.sand.low i { background: linear-gradient(90deg, var(--wax), var(--wax-hi)); }
.sand-text { font: 800 15px var(--f-body); font-variant-numeric: tabular-nums; min-width: 4.8em; text-align: right; color: var(--muted); }
.sand.low + .sand-text { color: var(--wax-hi); }
.well { position: relative; display: grid; justify-items: center; gap: 6px; text-align: center; }
.well-cards { display: flex; gap: 6px; }
.well-cap { font-size: 12px; color: var(--muted); max-width: 8.5em; }
.picker { position: absolute; z-index: 20; right: 0; top: 100%; margin-top: 8px; display: grid; grid-template-columns: repeat(7, 34px); gap: 4px; padding: 10px; background: var(--felt-2); border: 1px solid var(--brass); border-radius: 10px; box-shadow: 0 14px 34px rgba(0,0,0,.55); }
.picker button { height: 34px; border-radius: 6px; border: 1px solid var(--parch-edge); background: var(--parch); color: var(--ink); font: 800 16px var(--f-glyph); cursor: pointer; }
.picker button:hover { background: #fff6e2; }
.over { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 14px; text-align: center; background: rgba(12,20,17,.88); border-radius: 18px; padding: 20px; z-index: 5; }
.over h2 { font-size: clamp(28px, 4vw, 42px); color: var(--brass-hi); }

.me { display: grid; gap: 12px; padding: 16px; border-radius: 16px; border: 1px solid var(--line); background: rgba(0,0,0,.16); min-width: 0; }
.me.turn { border-color: var(--brass); box-shadow: 0 0 0 1px rgba(201,165,92,.25); }
.me-head { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-end; }
.me-head > div { display: grid; gap: 6px; }
.me-name { font: 22px/1.1 var(--f-display); }
.composer { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-height: calc(var(--g) * 1.32 + 22px); padding: 10px; border-radius: 12px; border: 1px dashed var(--brass); background: rgba(0,0,0,.2); }
.composer.nudge { animation: shake .35s; }
.composer .ph { color: var(--muted); font-style: italic; padding-left: 4px; }
.preview { font-size: 15px; min-height: 1.4em; }
.preview .st { margin-left: 8px; font-weight: 800; }
.preview.good .st { color: var(--good); }
.preview.bad, .preview.bad .st { color: var(--wax-hi); }
.preview.warn .st { color: var(--brass-hi); }
.hand { display: flex; flex-wrap: wrap; gap: 8px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.keys { font-size: 13px; color: var(--muted); }
.charm { display: grid; gap: 4px; padding: 8px 12px; border: 1px solid var(--brass); border-radius: 10px; max-width: 280px; background: rgba(201,165,92,.08); }
.charm b { font: 18px/1.1 var(--f-display); color: var(--brass-hi); font-weight: 400; }
.charm small { font-size: 13px; color: var(--muted); }
.charm.spent { opacity: .5; border-style: dashed; }
.coach { background: var(--parch); color: var(--ink); border-radius: 4px; padding: 10px 14px; transform: rotate(-.4deg); box-shadow: 0 6px 16px rgba(0,0,0,.35); max-width: 62ch; }
.coach .eyebrow { color: #7a6542; }
.coach .w { color: var(--wax) !important; }
.spectate h3 { font-size: 22px; color: var(--brass-hi); }

.chron { min-width: 0; padding: 14px; border-radius: 16px; border: 1px solid var(--line); background: rgba(0,0,0,.16); position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); max-height: calc(100vh - 40px); overflow: auto; }
.chron h3 { font-size: 20px; color: var(--brass-hi); }
.chron ol { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 8px; font-size: 14px; }
.chron li { padding-bottom: 8px; border-bottom: 1px solid rgba(58,82,71,.6); color: var(--muted); }
.chron li:first-child { color: var(--text); }
.chron li.k-seal, .chron li.k-out { color: var(--wax-hi); }
.chron li.k-win { color: var(--brass-hi); }

.overlay { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: rgba(9,15,13,.9); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet { width: min(760px, 100%); max-height: 100%; overflow: auto; padding: 24px; border-radius: 16px; background: var(--felt-2); border: 1px solid var(--brass); box-shadow: 0 20px 50px rgba(0,0,0,.5); display: grid; gap: 14px; }
.sheet h2 { font-size: 34px; color: var(--brass-hi); }
.sheet h3 { font-size: 22px; color: var(--brass-hi); margin-top: 6px; }
.sheet ul, .sheet ol { margin: 0; padding-left: 22px; display: grid; gap: 6px; }
.sheet .close { justify-self: end; }
.cover-card { width: min(460px, 100%); text-align: center; justify-items: center; }
.cover-card h2 { font-size: 44px; }

#toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); opacity: 0; pointer-events: none; background: var(--parch); color: var(--ink); padding: 10px 16px; border-radius: 10px; font-weight: 700; box-shadow: 0 10px 30px rgba(0,0,0,.45); transition: opacity .2s, transform .2s; z-index: 60; width: max-content; max-width: min(92vw, 520px); text-align: center; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#toast.bad { background: var(--wax-hi); color: #fff; }

@media (max-width: 960px) {
  .game { grid-template-columns: minmax(0,1fr); }
  .chron { position: static; max-height: 280px; }
  .hero, .primer { grid-template-columns: minmax(0,1fr); }
  .modes { grid-template-columns: minmax(0,1fr); }
}
@media (max-width: 760px) { .lobby { grid-template-columns: minmax(0,1fr); } }
@media (max-width: 640px) {
  :root { --g: 46px; }
  .table { grid-template-columns: auto minmax(0,1fr); gap: 14px; padding: 14px; }
  .well { grid-column: 1 / -1; grid-auto-flow: column; justify-content: start; align-items: center; gap: 10px; text-align: left; }
  .picker { left: 0; right: auto; }
  .dial { width: 88px; }
  .dial-in strong { font-size: 32px; }
  .banner { font-size: 16px; }
  .rivals { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">Ink <span>&amp;</span> Malice</div>
    <div class="top-right" id="topRight"></div>
  </header>
  <main id="screen"></main>
</div>
<div id="cover" class="overlay" hidden></div>
<div id="rules" class="overlay" hidden></div>
<div id="toast" role="status"></div>

      if (!m || m.type !== 'state' || !m.s) return;
      const sk = Date.now() - (m.t || Date.now());
      if (Math.abs(sk) > 2500) UI.skew = sk;
      else UI.skew = 0;
      setState(m.s);
    });
    conn.on('close', function () { if (closed) return; setConn(false); clearTimeout(retryT); retryT = setTimeout(connect, 3000); });
  }
  return new Promise(function (res, rej) {
    peer.on('error', function (e) {
      if (closed) return;
      if (!ever) { closed = true; try { peer.destroy(); } catch (x) { /* ignore */ } rej(e); return; }
      setConn(false);
      clearTimeout(retryT);
      retryT = setTimeout(connect, 3000);
    });
    peer.on('disconnected', function () { if (!closed) { try { peer.reconnect(); } catch (x) { /* ignore */ } } });
    Net.transport = {
      kind: 'peer',
      send: function (m) { if (conn && conn.open) conn.send(Object.assign({ clientId: Net.me }, m)); else toast('Not connected to the host right now.', 'bad'); },
      close: function () { closed = true; clearTimeout(retryT); try { peer.destroy(); } catch (x) { /* ignore */ } }
    };
    connect();
    const watch = setInterval(function () { if (ever) { clearInterval(watch); res(); } }, 100);
    setTimeout(function () {
      if (!ever && !closed) {
        clearInterval(watch);
        closed = true;
        try { peer.destroy(); } catch (x) { /* ignore */ }
        rej(new Error('Could not reach room ' + code + '. Check the code, and make sure the host has the page open.'));
      }
    }, 15000);
  });
}

function dbErrorText(e) {
  const c = e && e.code;
  if (c === 'invalid_argument') return 'Your friend needs edit access to this page to play online.';
  if (c === 'quota_exceeded') return 'Storage for this page is full.';
  if (c === 'resource_exhausted') return 'Too many moves at once. Wait a moment.';
  if (c === 'revoked') return 'Online access to this page was withdrawn.';
  return 'Could not reach the game server. Try again.';
}
function makeWriter(ref) {
  let busy = false;
  let next = null;
  let tries = 0;
  async function pump() {
    if (busy || !next) return;
    busy = true;
    const body = next;
    next = null;
    try { await ref.set(body); tries = 0; }
    catch (e) {
      if (e && e.code === 'unavailable' && tries < 3) { tries++; await sleep(500 + rnd(700)); if (!next) next = body; }
      else { tries = 0; toast(dbErrorText(e), 'bad'); }
    }
    busy = false;
    pump();
  }
  return { push: function (body) { next = body; pump(); } };
}
async function initCloud() {

    ONLINE.db = both[0];

}
async function loadResumable() {
  try {
    const q = await ONLINE.db.collection('games').where('hostId', '==', Net.me).get();
    ONLINE.resume = q.docs.map(function (d) { return { code: d.id, data: d.data() }; }).filter(function (x) {
      return x.data && x.data.s && x.data.status !== 'over' && Date.now() - (x.data.updated || 0) < 3 * 86400000;
    }).sort(function (a, b) { return (b.data.updated || 0) - (a.data.updated || 0); }).slice(0, 3);
  } catch (e) { ONLINE.resume = []; }
  refreshOnlineCard();
}
function processInbox(data) {
  if (!data || !S) return;
  const cid = String(data.client || '');
  if (!cid || !Array.isArray(data.msgs)) return;
  const msgs = data.msgs.filter(function (m) { return m && typeof m.n === 'number'; }).sort(function (a, b) { return a.n - b.n; });
  let changed = false;
  msgs.forEach(function (m) {
    let ack = 0;
    if (S.acks && S.acks[cid]) ack = S.acks[cid];
    if (m.n <= ack) return;
    S.acks = Object.assign({}, S.acks);
    S.acks[cid] = m.n;
    changed = true;
    hostReceive(cid, clone(m));
  });
  if (changed && Net.transport) Net.transport.publish();
}
async function cloudHost(name, settings, resume) {
  const db = ONLINE.db;
  let code = '';
  if (resume) code = resume.code;
  else {
    for (let i = 0; i < 5; i++) {
      code = genCode();
      const s = await db.doc('games/' + code).get();
      if (!s.exists) break;
    }
  }
  const ref = db.doc('games/' + code);
  const w = makeWriter(ref);
  let unsub = null;
  Net.transport = { kind: 'cloud', publish: function () { if (S) w.push({ hostId: Net.me, status: S.status, updated: Date.now(), s: S }); }, close: function () { if (unsub) unsub(); } };
  Net.code = code;
  Net.mode = 'host';
  Net.kind = 'online';
  resetUI();
  if (resume) setState(clone(resume.s));
  else setState(lobbyState(name, settings));
  Net.transport.publish();
  unsub = db.collection('games/' + code + '/inbox').onSnapshot(function (snap) {
    snap.docs.forEach(function (d) { processInbox(d.data()); });
  }, function (e) { toast(dbErrorText(e), 'bad'); });
}
async function cloudJoin(code, name) {
  const db = ONLINE.db;
  const ref = db.doc('games/' + code);
  const snap = await ref.get();
  if (!snap.exists || !snap.data() || !snap.data().s) throw new Error('There is no room called ' + code + '. Check the code with your host.');
  const inRef = db.doc('games/' + code + '/inbox/' + Net.me);
  const mine = await inRef.get();
  let msgs = [];
  if (mine.exists && mine.data() && Array.isArray(mine.data().msgs)) msgs = clone(mine.data().msgs);
  let seq = 0;
  msgs.forEach(function (m) { if (m.n > seq) seq = m.n; });
  const first = clone(snap.data());
  const acks = first.s.acks || {};
  if ((acks[Net.me] || 0) > seq) seq = acks[Net.me];
  const w = makeWriter(inRef);
  let unsub = null;
  Net.mode = 'guest';
  Net.kind = 'online';
  Net.code = code;
  Net.transport = {
    kind: 'cloud',
    send: function (m) { seq++; msgs.push(Object.assign({}, m, { n: seq })); msgs = msgs.slice(-12); w.push({ client: Net.me, msgs: msgs }); },
    close: function () { if (unsub) unsub(); }
  };
  resetUI();
  setState(first.s);
  unsub = ref.onSnapshot(function (s) { if (!s.exists) return; const d = s.data(); if (d && d.s) setState(clone(d.s)); }, function (e) { toast(dbErrorText(e), 'bad'); });
  Net.transport.send({ type: 'hello', name: name });
  saveLocal('im-last-room', code);
}

function updateCoach() {
  if (Net.kind !== 'practice' || !S || S.status !== 'playing' || !S.settings.coach) return;
  const t = S.turn;
  if (!t || t.seat !== 0 || t.waiting || (t.phase !== 'cast' && t.phase !== 'counter')) return;
  const key = t.id + ':' + S.seq;
  if (UI.coachKey === key) return;
  UI.coachKey = key;
  let need = 0;
  if (t.phase === 'counter') need = S.malice;
  const items = availableFor(S, 0);
  const res = searchWords(items, 1 + S.fx.blots, need, S.fx.bonus, false, 15);
  let best = null;
  res.forEach(function (r) { if (!best || r.score > best.score || (r.score === best.score && WORDS[r.w].length < WORDS[best.w].length)) best = r; });
  UI.coach = { turnId: t.id, phase: t.phase, need: need, count: res.length, best: null };
  if (best) UI.coach.best = { word: WORDS[best.w].toUpperCase(), score: best.score };
  if (UI.hintShown) render();
}
function makeCoachMsg(old) {
  const c = UI.coach;
  if (!old.settings.coach || !c || c.turnId !== old.turn.id) return;
  const ev = S.ev;
  let msg = '';
  let bestTxt = '';
  if (c.best) bestTxt = '<b class="w">' + c.best.word + '</b> for ' + c.best.score;
  if (ev && ev.seat === 0 && (ev.k === 'cast' || ev.k === 'counter')) {
    msg = 'You played <b class="w">' + esc(ev.word) + '</b> for ' + ev.score + '. ';
    if (c.best && c.best.score > ev.score) msg += 'The strongest word you had was ' + bestTxt + '.';
    else msg += 'That was the strongest word available. Well cast.';
  } else if (c.best) {
    if (c.phase === 'counter') msg = 'You could have beaten ' + c.need + ' with ' + bestTxt + '. There were ' + c.count + ' winning words.';
    else msg = 'You could have opened with ' + bestTxt + '.';
  } else {
    if (c.phase === 'counter') msg = 'No word could beat ' + c.need + ' with those glyphs, so yielding was right.';
    else msg = 'No word could be made from those glyphs.';
  }
  UI.coachMsg = msg;
  UI.coachMsgTurn = old.turn.id;
}

  if (t.waiting) return 'Getting ready';
  if (t.phase === 'cast') return 'Spelling an opening word';

}

const RULES_HTML =
  '<div class="sheet" role="dialog" aria-label="Rules"><button class="btn ghost small close" type="button" data-act="close-rules">Close</button>' +
  '<h2>How To Play</h2>' +
  '<p>Every duellist starts with 5 glyphs and three wax seals. Lose an exchange and a seal breaks. Lose all three and you are out. The last duellist standing wins.</p>' +
  '<h3>An Exchange</h3><ol>' +
  '<li><b>Opening cast.</b> The caster spells a word of 3 or more letters using their own glyphs. The total points set the Malice. If they cannot find one, they open at 0.</li>' +
  '<li><b>Aim.</b> The caster discards any glyphs they do not want, draws back to 5, and casts the word at any rival still in the duel.</li>' +
  '<li><b>Counter.</b> The target must spell a word worth more than the Malice before the sand runs out. They may use their own glyphs, the gilded glyph if revealed, the shared Inkblot, and every glyph in the word cast at them. A tie is not enough.</li>' +
  '<li><b>Success.</b> The counter becomes the new cast. Glyphs from the old word that were not reused are discarded. The successful player tidies their hand and aims at anyone, even straight back.</li>' +
  '<li><b>Failure.</b> If the target yields or the sand runs out, one of their seals breaks. The table is cleared and they make the next opening cast.</li></ol>' +
  '<h3>The Seals</h3><ul>' +
  '<li><b>I, Gilt Seal.</b> Reveals a gilded glyph worth extra points. You may add it to any later word. Once played it sits on the table for others to borrow, then leaves the game.</li>' +
  '<li><b>II, Charm Seal.</b> Reveals a charm you may use once, during any turn where you are spelling.</li>' +
  '<li><b>III, Final Seal.</b> You leave the duel, but first you choose a rival, other than the one who broke your seal, to face the word that beat you. They must counter it as normal. With nobody to curse, you simply leave.</li></ul>' +
  '<h3>The Charms</h3><ul>' + CHARM_KEYS.map(function (k) { return '<li><b>' + CHARMS[k].name + '.</b> ' + CHARMS[k].text + '</li>'; }).join('') + '</ul>' +
  '<h3>Words</h3><p>Words must have 3 or more letters and appear in the built-in dictionary of about 168,000 English words. Names, abbreviations and acronyms are not allowed. The Inkblot can stand for any letter but always scores 0.</p>' +
  '<h3>Controls</h3><p>Type letters to pick glyphs automatically, choosing your highest-value glyph for each letter. If no glyph matches, the Inkblot is used. Backspace removes the last letter, Enter casts, and Esc clears. You can also tap glyphs, and tap a glyph in your word to remove it.</p>' +
  '</div>';
function openRules() { const r = $('#rules'); r.innerHTML = RULES_HTML; r.hidden = false; const b = r.querySelector('.close'); if (b) b.focus(); }
function closeRules() { const r = $('#rules'); r.hidden = true; r.innerHTML = ''; }

/* ---------- Input ---------- */

function addLetter(L) {
  const me = mySeat();
  const items = availableFor(S, me).filter(function (it) { return it.l === L && !UI.compose.some(function (x) { return x.t === it.id; }); });
  if (items.length) {
    items.sort(function (a, b) { return (b.v - a.v) || (Number(a.own) - Number(b.own)); });
    UI.compose.push({ t: items[0].id });
  } else if (blotsLeft() > 0) {
    UI.compose.push({ b: 1, l: L });
  } else {
    nudge('No ' + L + ' available, and your Inkblot is already used.');
    return;
  }
  render();
}
function nudge(msg) {
  const c = document.getElementById('composer');
  if (c) { c.classList.remove('nudge'); void c.offsetWidth; c.classList.add('nudge'); }
  if (msg) toast(msg);
}
function doCast() {
  const me = mySeat();
  const spec = specFromCompose();
  const chk = checkWord(S, me, spec);
  if (!chk.ok) { nudge(chk.error); return; }
  dispatch({ type: 'submit', seat: me, spec: spec });
}
function composingNow() {
  if (!S || S.status !== 'playing' || !S.turn) return false;
  const t = S.turn;
  const me = mySeat();
  if (me < 0 || t.seat !== me || t.waiting || S.players[me].out) return false;
  return t.phase === 'cast' || t.phase === 'counter';
}
function onGlyph(src, id) {
  const me = mySeat();
  const t = S && S.turn;
  if (!t || t.seat !== me || t.waiting) return;
  if (src === 'blot') {
    if (!composingNow()) return;
    if (blotsLeft() > 0) { UI.picker = !UI.picker; render(); }
    else toast('Your Inkblot is already in the word. Tap it there to remove it.');
    return;
  }
  if (t.phase === 'tidy' && src === 'hand') {
    if (UI.disc.has(id)) UI.disc.delete(id);
    else UI.disc.add(id);
    render();
    return;
  }
  if (!composingNow()) return;
  const k = UI.compose.findIndex(function (x) { return x.t === id; });
  if (k >= 0) UI.compose.splice(k, 1);
  else UI.compose.push({ t: id });
  render();
}
function pickBlot(L) {
  UI.picker = false;
  if (composingNow() && blotsLeft() > 0) UI.compose.push({ b: 1, l: L });
  render();
}
function copyInvite() {
  let text = Net.code;
  if (Net.transport && Net.transport.kind === 'peer' && /^https?:$/.test(location.protocol)) text = location.href.split('#')[0] + '#join-' + Net.code;
  const done = function () { toast('Copied: ' + text); };
  try {
    navigator.clipboard.writeText(text).then(done, function () { toast('Copy failed. The code is ' + Net.code + '.'); });
  } catch (e) { toast('The code is ' + Net.code + '.'); }
}
function handleAct(act, el) {
  if (act === 'practice-start') startPractice();
  else if (act === 'hotseat-start') startHotseat();
  else if (act === 'hs-add') { readHsNames(); if (UI.hsNames.length < 5) UI.hsNames.push('Player ' + (UI.hsNames.length + 1)); renderHsNames(); }
  else if (act === 'hs-remove') { readHsNames(); if (UI.hsNames.length > 2) UI.hsNames.splice(Number(el.dataset.i), 1); renderHsNames(); }
  else if (act === 'online-create') onlineCreate();
  else if (act === 'online-join') onlineJoin();
  else if (act === 'resume') onlineResume(el.dataset.code);
  else if (act === 'rules') openRules();
  else if (act === 'close-rules') closeRules();
  else if (act === 'add-bot') { const s = document.getElementById('lb-level'); if (s) UI.botLevel = s.value; applyAction({ type: 'addBot', level: UI.botLevel }, false); }
  else if (act === 'remove-player') applyAction({ type: 'removePlayer', index: Number(el.dataset.i) }, false);
  else if (act === 'start') applyAction({ type: 'start' }, false);
  else if (act === 'again') applyAction({ type: 'again' }, false);
  else if (act === 'copy-code') copyInvite();
  else if (act === 'leave-ask') {
    if (UI.confirmLeave) { leaveGame(); return; }
    UI.confirmLeave = true;
    renderTop();
    setTimeout(function () { UI.confirmLeave = false; renderTop(); }, 3000);
  }
  else if (act === 'leave') leaveGame();
  else if (act === 'cast') doCast();
  else if (act === 'clear') { UI.compose = []; UI.picker = false; render(); }
  else if (act === 'shuffle') { UI.order = shuffle(UI.order.slice()); render(); }
  else if (act === 'hint') { UI.hintShown = true; UI.coachKey = ''; updateCoach(); render(); }
  else if (act === 'fizzle') dispatch({ type: 'fizzle', seat: mySeat() });
  else if (act === 'yield') dispatch({ type: 'yield', seat: mySeat() });
  else if (act === 'charm') dispatch({ type: 'charm', seat: mySeat() });
  else if (act === 'target') dispatch({ type: 'tidy', seat: mySeat(), discard: Array.from(UI.disc), target: Number(el.dataset.seat) });
  else if (act === 'curse') dispatch({ type: 'curse', seat: mySeat(), target: Number(el.dataset.seat) });
  else if (act === 'ready') { if (S && S.turn) dispatch({ type: 'ready', seat: S.turn.seat }); }
}
document.addEventListener('click', function (e) {
  if (e.target.id === 'rules') { closeRules(); return; }
  const el = e.target.closest('[data-act],[data-src],[data-ci],[data-pick]');
  if (!el) {
    if (UI.picker && !e.target.closest('.picker')) { UI.picker = false; render(); }
    return;
  }
  if (el.disabled) return;
  if (el.dataset.pick) { pickBlot(el.dataset.pick); return; }
  if (el.dataset.ci !== undefined) { UI.compose.splice(Number(el.dataset.ci), 1); render(); return; }
  if (el.dataset.src) { onGlyph(el.dataset.src, Number(el.dataset.id)); return; }
  handleAct(el.dataset.act, el);
});
document.addEventListener('change', function (e) {
  const id = e.target.id;
  if (id === 'lb-timer') applyAction({ type: 'settings', timer: Number(e.target.value) }, false);
  else if (id === 'lb-dict') applyAction({ type: 'settings', dict: e.target.checked }, false);
  else if (id === 'lb-level') UI.botLevel = e.target.value;
});
document.addEventListener('keydown', function (e) {
  const tag = e.target && e.target.tagName;
  if (e.key === 'Escape' && !$('#rules').hidden) { closeRules(); return; }
  if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') {
    if (e.key === 'Enter' && e.target.id === 'on-code') onlineJoin();
    return;
  }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (UI.screen !== 'game' || !S || S.status !== 'playing') return;
  const t = S.turn;
  if (Net.kind === 'hotseat' && t.waiting && e.key === 'Enter') { e.preventDefault(); dispatch({ type: 'ready', seat: t.seat }); return; }
  if (!composingNow()) return;
  if (/^[a-zA-Z]$/.test(e.key)) {
    e.preventDefault();
    const L = e.key.toUpperCase();
    if (UI.picker) { pickBlot(L); return; }
    addLetter(L);
    return;
  }
  if (e.key === 'Backspace') { e.preventDefault(); UI.compose.pop(); render(); return; }
  if (e.key === 'Enter') { e.preventDefault(); doCast(); return; }
  if (e.key === 'Escape') { UI.compose = []; UI.picker = false; render(); }
});

setInterval(function () {
  tickTimer();
  if (UI.pending && Date.now() - UI.pending > 8000) { UI.pending = 0; toast('No answer from the host yet. They may have lost their connection.', 'bad'); render(); }
  if (Net.mode === 'guest' || !S || S.status !== 'playing') return;
  const t = S.turn;
  if (!t || t.waiting || !t.deadline) return;
  let grace = 400;
  if (Net.mode === 'host') grace = 1500;
  if (Date.now() > t.deadline + grace) applyAction({ type: 'timeout', turnId: t.id }, true);
}, 200);

window.__inkmalice = { peek: function () { return { S: S, me: mySeat(), net: Net.mode, kind: Net.kind }; }, setBotSpeed: function (s) { botSpeed = s; }, WORDS: function () { return WORDS; }, reduce: reduce, newGame: newGame, botAction: botAction, checkWord: checkWord, searchWords: searchWords, availableFor: availableFor, ensureWords: ensureWords, alive: alive, HAND: HAND, DICT: DICT };

render();
setTimeout(ensureWords, 60);
if (ONLINE.env === 'cloud-pending') initCloud();
})();
</script>
</body>
</html>
